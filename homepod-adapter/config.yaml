name: "HomePod MQTT Bridge"
slug: "homepod_adapter"
description: "Receives HomePod sensor data and creates MQTT-discovered devices and sensors."
version: "2.0.2"
url: "https://github.com/oformaniuk/ha-addons/tree/main/homepod-adapter"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false

breaking_versions:
  - "2.0.0"

# Expose the webhook receiver for HomePods or their bridge to call.
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "HomePod webhook receiver"
watchdog: "tcp://[HOST]:[PORT:8080]"

options:
  # Optional; do not put this value in a URL or commit it to source control.
  endpoint_token: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_discovery_prefix: "homeassistant"
  homepods: []

schema:
  endpoint_token: password
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  mqtt_discovery_prefix: str
  homepods:
    - name: str
      guid: str
