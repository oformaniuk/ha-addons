name: Update Codex add-on

on:
  schedule:
    # Check after the npm registry's usual daily publishing window.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check npm for a new Codex CLI release
        id: versions
        working-directory: ha_codex
        shell: bash
        run: |
          set -euo pipefail

          current_codex_version="$(sed -nE 's/^ARG CODEX_VERSION=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' Dockerfile)"
          latest_codex_version="$(curl --fail --silent --show-error --location \
            https://registry.npmjs.org/@openai%2fcodex/latest | jq --raw-output '.version')"

          if [[ ! "$latest_codex_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected Codex version from npm: $latest_codex_version" >&2
            exit 1
          fi

          if [[ "$current_codex_version" == "$latest_codex_version" ]]; then
            echo "No Codex update available."
            echo "update_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "current_codex_version=$current_codex_version" >> "$GITHUB_OUTPUT"
          echo "latest_codex_version=$latest_codex_version" >> "$GITHUB_OUTPUT"
          echo "update_available=true" >> "$GITHUB_OUTPUT"

      - name: Update add-on metadata
        if: steps.versions.outputs.update_available == 'true'
        working-directory: ha_codex
        env:
          CODEX_VERSION: ${{ steps.versions.outputs.latest_codex_version }}
          ADDON_VERSION: ${{ steps.versions.outputs.latest_codex_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          codex_version = os.environ["CODEX_VERSION"]
          addon_version = os.environ["ADDON_VERSION"]

          dockerfile = Path("Dockerfile")
          dockerfile.write_text(re.sub(
              r"^ARG CODEX_VERSION=.+$",
              f"ARG CODEX_VERSION={codex_version}",
              dockerfile.read_text(),
              flags=re.MULTILINE,
          ))

          config = Path("config.yaml")
          config.write_text(re.sub(
              r'^version: "[^"]+"$',
              f'version: "{addon_version}"',
              config.read_text(),
              count=1,
              flags=re.MULTILINE,
          ))

          changelog = Path("CHANGELOG.md")
          changelog.write_text(changelog.read_text().replace(
              "# Changelog\n",
              f"# Changelog\n\n## {addon_version}\n\n"
              f"- Updates Codex CLI to version `{codex_version}`.\n",
              1,
          ))
          PY

      - name: Commit update directly to the default branch
        if: steps.versions.outputs.update_available == 'true'
        working-directory: ha_codex
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CODEX_VERSION: ${{ steps.versions.outputs.latest_codex_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile config.yaml CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(ha_codex): update Codex to ${CODEX_VERSION}"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:${DEFAULT_BRANCH}"
