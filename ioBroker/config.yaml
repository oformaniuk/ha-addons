name: "ioBroker (official image)"
slug: "iobroker"
description: "ioBroker using the official Docker image, persisting into addon_config."
version: "latest-v11"
arch: 
  - armv7
  - aarch64
  - amd64

startup: application
boot: auto
init: true
ingress: false

hassio_role: "default"
hassio_api: true

panel_icon: "mdi:iobroker"

ports:
  8081/tcp: 8081

ports_description:
  8081/tcp: "ioBroker Admin UI"

webui: "http://[HOST]:[PORT:8081]/"

map:
  - type: addon_config
    path: /opt/iobroker
    read_only: false

environment:
  TZ: "America/Los_Angeles"
