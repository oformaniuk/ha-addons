---
name: "Codex"
description: "AI coding agent for editing Home Assistant configuration with Codex CLI, ttyd, MCP integration, LSP helpers, and persistent sessions without tmux"
version: "0.157.0"
slug: "ha_codex"
url: "https://github.com/openai/codex"
arch:
  - aarch64
  - amd64
startup: application
init: false

# Ingress configuration: ttyd terminal exposed inside the HA sidebar.
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:console-line
panel_title: Codex

# Optional direct web and SSH access for debugging / native terminal use.
ports:
  8099/tcp: null
  2222/tcp: null
ports_description:
  8099/tcp: "Optional direct ttyd web terminal; HA ingress is preferred"
  2222/tcp: "Optional SSH access to the same persistent Codex session"

# File access - Home Assistant config directory.
map:
  - type: homeassistant_config
    path: /homeassistant
    read_only: false
  - type: app_config
    path: /data/.codex/
    read_only: false

# API access - needed for logs, add-on discovery, MCP tools, and validation helpers.
hassio_api: true
hassio_role: manager
homeassistant_api: true

# Security posture. The add-on can edit /homeassistant, but does not need host networking or privileged mode.
host_network: false
privileged: []
apparmor: true

options:
  # Feature toggles
  mcp_enabled: true
  lsp_enabled: true

  # UI mode: tui runs Codex in ttyd + dtach. shell opens a persistent shell instead.
  ui_mode: "tui"

  # Terminal appearance
  terminal_theme: "breeze"
  font_size: 14
  cursor_style: "block"
  cursor_blink: false

  # Codex defaults. Empty values mean Codex defaults.
  codex_model: ""
  codex_model_provider: ""
  custom_model_providers: []
  codex_approval_policy: "on-request"
  codex_sandbox_mode: "danger-full-access"
  codex_default_permissions: ":workspace"

  # Optional SSH access. Prefer public key; leave password empty.
  ssh_enabled: false
  ssh_public_key: ""
  ssh_password: ""

  # Long-lived access token for direct HA Core API access.
  # Required only for ESPHome-like tools that cannot use the Supervisor token.
  access_token: ""

  # Environment variables to inject into the container and Codex session.
  env_vars: []

  # Advanced: appended verbatim to ~/.codex/config.toml.
  codex_config_extra: ""

schema:
  mcp_enabled: bool
  lsp_enabled: bool
  ui_mode: list(tui|shell)
  terminal_theme: list(breeze|catppuccin_mocha|catppuccin_latte|dracula|nord|tokyo_night|one_dark|solarized_dark|solarized_light|gruvbox_dark)
  font_size: int(10,24)
  cursor_style: list(block|underline|bar)
  cursor_blink: bool
  codex_model: str
  codex_model_provider: str
  custom_model_providers:
    - provider: str
      name: str
      base_url: str
      wire_api: list(responses|chat)
      env_key: password
      supports_websockets: bool
      requires_openai_auth: bool
  codex_approval_policy: list(untrusted|on-request|never)
  codex_sandbox_mode: list(read-only|workspace-write|danger-full-access)
  codex_default_permissions: str
  ssh_enabled: bool
  ssh_public_key: str
  ssh_password: password
  access_token: str
  env_vars:
    - name: str
      value: str
  codex_config_extra: str

backup_exclude:
  - ".npm/*"
  - ".cache/*"
  - ".local/share/codex/cache/*"
  - ".env_vars"
  - ".ssh/*"
